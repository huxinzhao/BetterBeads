<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RC4 新增界面统一审阅</title><style>body{margin:24px;background:#32251d;color:#f6dfbd;font:17px system-ui,"Microsoft YaHei",sans-serif}main{max-width:1280px;margin:auto}img{display:block;max-width:100%;height:auto;border:1px solid #a56c34;margin:16px 0 32px}a{color:#ffd569}</style><main><h1>新增界面 · 统一样式</h1><p>非游戏截图。使用实际布局、星露谷木框/红叉与模组素材；未使用 AI 生图，未启动游戏。图中字体为离线替代，原生字体、动画、操作和实际场景仍需游戏内验收。</p><p><a href="../../docs/RC4_PLAYER_COPY.txt">可编辑新增文案</a> · <a href="../../docs/RC4_SOURCE_REVIEW.md">修改与检查记录</a></p><h2>未保存作品恢复</h2><p>预览、说明和操作分区；恢复为主操作，红叉保留缓存并关闭工作台。删除仍需确认。</p><img src="recovery-wide.png?style=native"><img src="recovery-small.png?style=native"><h2>移动与复制</h2><p>统一返回红叉；移动/复制独立显示当前模式，取消不修改作品，应用可撤销。</p><img src="move-wide.png?style=native"><img src="move-small.png?style=native"><h2>武器判定说明</h2><p>方形图案与文字分栏；长说明按段落分页，不缩小字号。十字为分析握持端。</p><img src="shape-wide.png?style=native"><img src="shape-small.png?style=native"><img src="shape-page2-small.png?style=native"><h2>重复纹样与接缝</h2><p>连续纹样示意；金色标记用于检查重复边界，不改变实际图案。</p><img src="seams-wide.png?style=native"></main></html>
